name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      board:
        description: phone (vince = Redmi 5 Plus 1080x2160, rosy = Redmi 5 720x1440)
        type: choice
        options: [rosy, vince]
        default: rosy
  push:
    branches: [main, vince]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"


concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  # vince (Redmi 5 Plus): Cortex-A53 has no 16 KiB granule, so 4 KiB pages (TOPAZ_4K) plus the VINCE board
  # variant (GICv2, 24 bpp console, boot CPU 0). Both are read by makedefs/MakeInc.def.
  TOPAZ_4K: "1"
  VINCE: "1"
  # rosy (Redmi 5, SDM450): the vince board with a 720x1440 panel (xnu/patches/0960, makedefs/MakeInc.def).
  # This branch builds rosy unless the run is started by hand with board=vince.
  ROSY: ${{ (inputs.board || 'rosy') == 'rosy' && '1' || '0' }}
  # ccache: xnu is ~2000 compiles; a patch usually changes a few of them
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    # macos-15 still ships Xcode 16.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64.
          # topaz: Cortex-A53/A73 (ARMv8.0), so the same -mcpu as the kernel
          # (clang's apple-m1 default emits LSE atomics and LDAPR)
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"' dxb/build.sh
          # xnu's makedefs take CC/CXX from the environment dxb exports; xcodebuild
          # (mig, ctf tools) needs a single executable, so point at wrappers
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
          mkdir -p "$CCACHE_WRAP"
          for t in clang clang++; do
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(xcrun -find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done
          cat "$CCACHE_WRAP/clang"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ hashFiles('xnu/patches/**', '.github/workflows/xnu.yml') }}
          restore-keys: |
            ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          ccache -z
          bash build.sh
          ccache -s

      - name: Check that the vince patches were applied
        if: always()
        run: |
          # dxb applies patches with `git apply` and skips a failing one silently: a kernel built without
          # them would boot-loop on the phone for no visible reason, so fail loudly instead.
          for f in makedefs/MakeInc.def pexpert/arm/pe_fiq.c osfmk/arm64/sweet_early.c osfmk/arm64/sleh.c iokit/Kernel/arm/SweetCPU.cpp pexpert/arm/pe_serial.c osfmk/arm64/start.s osfmk/arm64/arm_vm_init.c pexpert/pexpert/arm64/SWEET.h; do
            if grep -q VINCE "dxb/xnu/$f"; then echo "ok   $f"; else echo "MISSING vince patch in $f"; missing=1; fi
          done
          # the panel size comes from -D flags of MakeInc.def (0960); these files must use them
          for f in makedefs/MakeInc.def osfmk/arm64/start.s osfmk/arm64/sweet_early.c iokit/Kernel/arm/SweetFramebuffer.cpp iokit/Kernel/arm/hid/SweetHID.cpp; do
            if grep -q VINCE_PANEL_W "dxb/xnu/$f" || grep -q VINCE_PANEL_STRIDE "dxb/xnu/$f"; then echo "ok   $f (panel size)"; else echo "MISSING panel-size change in $f"; missing=1; fi
          done
          # reset paths (1010 adds the file, 0963 builds and starts it): without them a stopped kernel
          # can only be ended by unplugging the battery
          if [ -f dxb/xnu/osfmk/arm64/vince_reset.c ] && grep -q vince_reset dxb/xnu/osfmk/conf/files.arm64 && grep -q vince_reset_start dxb/xnu/pexpert/arm/pe_init.c; then
            echo "ok   vince_reset.c (built and started)"
          else
            echo "MISSING reset patch (1010 / 0963)"; missing=1
          fi
          # 1011: screen-sized surface buffers set aside without the GPU (a patch with context: check it applied)
          if grep -q sweet_res_wanted dxb/xnu/iokit/Kernel/arm/SweetSurface.cpp; then echo "ok   SweetSurface.cpp (1011 surface reserve)"; else echo "MISSING patch 1011 in SweetSurface.cpp"; missing=1; fi
          echo "board: ROSY=$ROSY"
          [ -z "${missing:-}" ]

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          echo "board=$([ "$ROSY" = 1 ] && echo rosy || echo vince) ROSY=$ROSY VINCE=$VINCE TOPAZ_4K=$TOPAZ_4K commit=$GITHUB_SHA" > out/BOARD.txt
          cat out/BOARD.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
